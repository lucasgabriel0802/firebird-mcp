[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firebird-mcp"
version = "0.1.0"
description = "Open-source community MCP Server for Firebird Database (2.5 to 5.0) - Multi-database, execution plans and inspection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "firebirdsql>=1.2.2",
    "python-dotenv>=1.0.0",
    "passlib>=1.7.4"
]

[project.scripts]
firebird-mcp = "firebird_mcp.server:main"
